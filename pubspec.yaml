name: appteacher
description: "إتقان للتعليم والتنمية - نظام إدارة الحلقات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.6
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  screenshot: ^3.0.0
  share_plus: ^13.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  package_info_plus: ^10.2.0
  http: ^1.2.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo2.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo2.jpg
    - assets/fonts/ArabicNaskh-Regular.ttf
    - assets/fonts/Arial-Regular.ttf
    - assets/image/
